# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

ci = {
    autoupdate_schedule = "quarterly",
    autofix_commit_msg = "prek auto-fixes",
    autoupdate_commit_msg = "prek autoupdate"
  }

[[repos]]
repo = "local"
hooks = [
  {
    id = "generate-api-docs",
    name = "generate api docs",
    entry = "python scripts/generate_api_docs.py",
    language = "python",
    pass_filenames = false
  },
  {
    id = "ruff-check",
    name = "ruff check",
    entry = "uv --cache-dir /tmp/uv-cache run ruff check --fix src scripts examples",
    language = "system",
    pass_filenames = false
  },
  {
    id = "ruff-format",
    name = "ruff format",
    entry = "uv --cache-dir /tmp/uv-cache run ruff format src scripts examples",
    language = "system",
    pass_filenames = false
  },
  {
    id = "ty",
    name = "ty",
    entry = "uv --cache-dir /tmp/uv-cache run ty check src/elementembeddings",
    language = "system",
    pass_filenames = false,
    stages = ["manual"]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.47.0"
hooks = [
  {
    id = "markdownlint",
    args = [
      "--disable",
      "MD013",
      "MD024",
      "MD025",
      "MD033",
      "MD041",
      "--"
    ]
  }
]

[[repos]]
repo = "https://github.com/kynan/nbstripout"
rev = "0.9.1"
hooks = [
  {
    id = "nbstripout",
    args = [
      "--drop-empty-cells",
      "--keep-output"
    ]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v4.0.0-alpha.8"
hooks = [
  {
    id = "prettier",
    args = ["--write"],
    additional_dependencies = ["prettier"]
  }
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.1"
hooks = [
  {
    id = "codespell",
    stages = [
      "pre-commit",
      "commit-msg"
    ],
    args = [
      "--toml",
      "pyproject.toml"
    ],
    additional_dependencies = ["tomli"]
  }
]

[[repos]]
repo = "https://github.com/adamchainz/blacken-docs"
rev = "1.20.0"
hooks = [
  { id = "blacken-docs" }
]
