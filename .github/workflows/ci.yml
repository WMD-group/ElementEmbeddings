name: ElementEmbeddings CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run prek hooks
        env:
          PREK_HOME: /tmp/prek-home
        run: uv run prek run --all-files --show-diff-on-failure

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run ty
        run: uv run ty check src/elementembeddings --output-format github

  test:
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Check package versions
        run: |
          uv pip show elementembeddings
          uv pip show pytest
          uv pip show matplotlib

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: uv run python -m pytest --mpl --mpl-baseline-path=tests/baseline --cov=src/elementembeddings -v
