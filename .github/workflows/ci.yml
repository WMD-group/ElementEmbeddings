name: ElementEmbeddings CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --upgrade uv
          uv sync --extra dev
      - name: Run prek hooks
        env:
          PREK_HOME: /tmp/prek-home
        run: uv run prek run --all-files --show-diff-on-failure

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --upgrade uv
          uv sync --extra dev
      - name: Run ty
        run: uv run ty check src/elementembeddings --output-format github

  test:
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --upgrade uv
          uv sync --extra dev
      - name: Check package versions
        run: |
          uv run python -m pip show elementembeddings
          uv run python -m pip show pytest
          uv run python -m pip show matplotlib

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: uv run python -m pytest --mpl --mpl-baseline-path=src/elementembeddings/tests/baseline --cov=src/elementembeddings -v
